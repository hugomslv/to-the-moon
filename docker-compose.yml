version: "3.9"

services:
  app:
    build: .
    container_name: to-the-moon
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/production.db
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    driver: local
